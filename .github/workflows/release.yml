name: Release

# Baut beim Push eines Tags vX.Y.Z die App auf einem GitHub-Runner, hängt ZIP + SHA256SUMS an
# ein GitHub-Release und erzeugt eine signierte Build-Provenance-Attestation (Sigstore).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write      # Release anlegen
      id-token: write      # Attestation signieren (OIDC)
      attestations: write  # Attestation speichern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version im Tag und in der Info.plist vergleichen
        run: |
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [ "v$plist_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu Info.plist ($plist_version)" >&2
            exit 1
          fi

      - name: Testen und bauen
        run: ./build.sh --release

      - name: Build-Provenance-Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/TUvpn-macOS.zip

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes_file" ]; then notes_args=(--notes-file "$notes_file"); else notes_args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/TUvpn-macOS.zip dist/SHA256SUMS \
            --title "TU VPN $GITHUB_REF_NAME" "${notes_args[@]}"
