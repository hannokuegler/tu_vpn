name: Fehler melden · Bug report
description: Etwas funktioniert nicht · Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Danke! Bitte **keine Passwörter, MFA-Codes oder Session-Cookies** posten – die stehen auch in keinem Log. Die e-Nummer darfst du schwärzen.
        Thanks! Please **don't post passwords, MFA codes or session cookies** – they aren't in any log either. Feel free to redact your e-number.
        Sicherheitslücken bitte privat melden · Report security issues privately: [SECURITY.md](https://github.com/hannokuegler/tu_vpn/blob/main/SECURITY.md)
  - type: textarea
    id: what-happened
    attributes:
      label: Was ist passiert? · What happened?
      description: Was hast du geklickt, was hast du erwartet, was kam stattdessen (Fehlermeldung im Wortlaut)? · What did you click, what did you expect, what happened instead (exact error message)?
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS-Version · macOS version
      description: Apple-Menü → Über diesen Mac · Apple menu → About This Mac
      placeholder: "z. B. / e.g. macOS 15.3 (Apple Silicon)"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: TU-VPN-Version · TU VPN version
      description: Menü → Weitere · Menu → More
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profil · Profile
      options:
        - Nur TU · TU only
        - Alles getunnelt · All traffic
        - egal / unklar · doesn't matter / unsure
  - type: dropdown
    id: mode
    attributes:
      label: Modus · Mode
      options:
        - Admin-Dialog (Standard) · Admin dialog (default)
        - Ohne Mac-Passwort · Without Mac password
  - type: input
    id: openconnect
    attributes:
      label: openconnect-Version
      description: "Terminal: openconnect --version | head -1"
      placeholder: "OpenConnect version v9.21"
  - type: textarea
    id: logs
    attributes:
      label: Logs (ohne Geheimnisse · without secrets)
      description: |
        Die letzten ~30 Zeilen · The last ~30 lines:
        `tail -n 30 ~/Library/Logs/TUvpn-auth.log` und/and `tail -n 30 /var/log/tuvpn.log`
        Bitte vorher drüberschauen und Persönliches schwärzen · Please check and redact personal data first.
      render: text
